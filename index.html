<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Amr & Farah Wedding">
<meta property="og:description" content="You are invited">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Amr &amp; Farah Wedding</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Pinyon+Script&family=Cormorant+SC:wght@500&family=EB+Garamond:ital@0;1&family=Aref+Ruqaa:wght@400;700&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a single letterpress-style invitation card on ivory; a velvet jewellery-box arch with turning 3D gold rings opens it, then the date, countdown, a gold-ink map and RSVP. Single ivory look by choice. */
:root{
  --ivory:#FFFDF9; --card:#FFFFFF; --ink:#4A3A22; --ink-soft:#8C7A58;
  --gold:#B8913F; --gold-hi:#EBD7A3; --gold-lo:#8C6A2B; --blush:#F3E7CF; --sage:#D9C28C;
  --f-script:"Pinyon Script","Snell Roundhand",cursive;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-caps:"Cormorant SC","Trajan Pro",Georgia,serif;
  --f-body:"EB Garamond",Garamond,Georgia,serif;
  --f-ar-script:"Aref Ruqaa","Amiri",serif;
  --f-ar:"Amiri","Geeza Pro","Noto Naskh Arabic",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  background:
    radial-gradient(60% 40% at 15% 0%, rgba(235,215,163,.28), transparent 70%),
    radial-gradient(50% 40% at 100% 30%, rgba(235,215,163,.18), transparent 70%),
    var(--ivory);
  color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.65;padding-block:0 64px;overflow-x:hidden;
}
html[lang="ar"] body{font-family:var(--f-ar);font-size:19px;line-height:1.9}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--ivory)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:rgba(255,253,249,.88);backdrop-filter:blur(10px)}
.tabs .gut{display:flex;justify-content:center;padding-block:12px}
.seg{display:inline-flex;gap:28px;direction:ltr}
.seg button{font:inherit;background:none;border:0;cursor:pointer;color:var(--ink-soft);padding:4px 2px;position:relative}
.seg button[data-l="en"]{font-family:var(--f-caps);letter-spacing:.3em;font-size:.9rem}
.seg button[data-l="ar"]{font-family:var(--f-ar);font-size:1.1rem}
.seg button::after{content:"";position:absolute;left:50%;bottom:-2px;width:0;height:1px;background:var(--gold);transition:width .35s,left .35s}
.seg button[aria-selected="true"]{color:var(--ink)}
.seg button[aria-selected="true"]::after{width:100%;left:0}
.seg button:focus-visible{outline:1px solid var(--gold);outline-offset:4px}

main{max-width:500px;margin:0 auto;padding-top:18px;position:relative;z-index:2}
.card{
  position:relative;background:var(--card);text-align:center;
  padding:28px 22px 44px;display:flex;flex-direction:column;align-items:center;gap:40px;
  box-shadow:0 1px 0 rgba(176,141,74,.25),0 30px 60px -30px rgba(140,106,43,.3);
}
.card::before,.card::after{content:"";position:absolute;pointer-events:none}
.card::before{inset:10px;border:1px solid rgba(176,141,74,.55)}
.card::after{inset:15px;border:.5px solid rgba(176,141,74,.3)}
.card > *{position:relative;z-index:1}

.art{width:min(100%,330px);max-width:100%;height:auto;display:block;overflow:visible}
.seal{width:62px;height:62px;margin-top:-30px}

.pre{font-family:var(--f-caps);letter-spacing:.32em;font-size:.82rem;color:var(--ink-soft);margin:0;max-width:30ch}
html[lang="ar"] .pre{font-family:var(--f-ar);letter-spacing:0;font-size:1.15rem}

.foil{
  background:linear-gradient(100deg,var(--gold-lo) 0%,var(--gold) 22%,var(--gold-hi) 38%,var(--gold) 52%,var(--gold-lo) 70%,var(--gold) 100%);
  background-size:250% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
}
@media (prefers-reduced-motion:no-preference){ .foil{animation:sheen 7s ease-in-out infinite} }
@keyframes sheen{0%,100%{background-position:0% 0}50%{background-position:100% 0}}

.names{margin:0;display:flex;flex-direction:column;align-items:center;line-height:1}
.names .n{font-family:var(--f-script);font-weight:400;font-size:clamp(3.6rem,18vw,5.2rem);padding-inline:.15em;line-height:1.15}
.names .and{font-family:var(--f-display);font-style:italic;font-size:1.3rem;color:var(--ink-soft);margin-block:-4px}
html[lang="ar"] .names .n{font-family:var(--f-ar-script);font-size:clamp(3rem,15vw,4.2rem);line-height:1.5}
html[lang="ar"] .names .and{font-family:var(--f-ar);font-style:normal;font-size:1.5rem;margin-block:-14px}

.invite{margin:0;font-style:italic;font-size:1.18rem;color:var(--ink);max-width:28ch}
html[lang="ar"] .invite{font-style:normal;font-size:1.3rem}

.sprig{width:170px;height:22px}

.date{display:flex;flex-direction:column;align-items:center;gap:6px}
.date .month{font-family:var(--f-caps);letter-spacing:.42em;font-size:1rem;padding-left:.42em}
html[lang="ar"] .date .month{font-family:var(--f-ar);letter-spacing:0;padding:0;font-size:1.3rem}
.date .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;width:min(320px,100%)}
.date .side{font-family:var(--f-caps);letter-spacing:.24em;font-size:.86rem;border-block:1px solid rgba(176,141,74,.6);padding-block:8px;color:var(--ink-soft)}
html[lang="ar"] .date .side{font-family:var(--f-ar);letter-spacing:0;font-size:1.15rem}
.date .day{font-family:var(--f-display);font-size:5rem;line-height:.95;font-variant-numeric:lining-nums}
html[lang="ar"] .date .day{font-family:var(--f-ar);font-weight:700;font-size:4.4rem}
.date .year{font-family:var(--f-caps);letter-spacing:.42em;font-size:1rem;padding-left:.42em}
html[lang="ar"] .date .year{font-family:var(--f-ar);letter-spacing:0;padding:0;font-size:1.3rem}

.count{display:flex;align-items:flex-start;justify-content:center;gap:4px}
.unit{display:flex;flex-direction:column;align-items:center;width:64px}
.unit b{font-family:var(--f-display);font-weight:400;font-size:2.1rem;line-height:1.1;font-variant-numeric:tabular-nums}
html[lang="ar"] .unit b{font-family:var(--f-ar)}
.unit span{font-family:var(--f-caps);letter-spacing:.2em;font-size:.68rem;color:var(--ink-soft)}
html[lang="ar"] .unit span{font-family:var(--f-ar);letter-spacing:0;font-size:.95rem}
.colon{font-family:var(--f-display);color:var(--gold);font-size:1.6rem;line-height:1.4}
.count-done{font-family:var(--f-script);font-size:2.6rem}
html[lang="ar"] .count-done{font-family:var(--f-ar-script);font-size:2rem}

.label{font-family:var(--f-caps);letter-spacing:.34em;font-size:.76rem;color:var(--gold)}
html[lang="ar"] .label{font-family:var(--f-ar);letter-spacing:0;font-size:1.1rem}
.venue{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.venue h2{margin:0;font-family:var(--f-display);font-weight:400;font-style:italic;font-size:2.6rem;line-height:1.1}
html[lang="ar"] .venue h2{font-family:var(--f-ar-script);font-style:normal;font-size:2.4rem;line-height:1.5}

.map{width:100%;border:1px solid rgba(176,141,74,.5);padding:6px;background:var(--ivory)}
.map canvas{display:block;width:100%;aspect-ratio:5/4;max-width:100%}

.links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{font-family:var(--f-caps);letter-spacing:.24em;font-size:.8rem;color:#fff;background:linear-gradient(135deg,#C9A24F,#A47E33 60%,#C9A24F);border:1px solid var(--gold);padding:13px 22px;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:background .3s,color .3s,border-color .3s}
html[lang="ar"] .btn{font-family:var(--f-ar);letter-spacing:0;font-size:1.05rem;padding-block:9px}
.btn.line{background:transparent;color:var(--ink);border-color:var(--gold)}
.btn:hover{background:var(--gold-lo);border-color:var(--gold-lo);color:#fff}
.btn:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
.btn svg{width:15px;height:15px;flex:none}

.rsvp{width:100%;display:flex;flex-direction:column;gap:18px;padding-top:6px}
.rsvp h3{margin:0;font-family:var(--f-script);font-weight:400;font-size:3rem;line-height:1.1}
html[lang="ar"] .rsvp h3{font-family:var(--f-ar-script);font-size:2.3rem;line-height:1.5}
.rsvp .note{margin:0;font-style:italic;color:var(--ink-soft)}
html[lang="ar"] .rsvp .note{font-style:normal}
.field{display:flex;flex-direction:column;gap:4px;text-align:start}
.field label{font-family:var(--f-caps);letter-spacing:.24em;font-size:.72rem;color:var(--ink-soft)}
html[lang="ar"] .field label{font-family:var(--f-ar);letter-spacing:0;font-size:1rem}
.field input,.field select{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid rgba(176,141,74,.6);padding:8px 2px;border-radius:0}
.field input:focus,.field select:focus{outline:none;border-bottom-color:var(--gold-lo)}
.choice{display:flex;gap:10px}
.choice label{flex:1;cursor:pointer}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice span{display:block;padding:11px 6px;border:1px solid rgba(176,141,74,.6);font-style:italic;color:var(--ink-soft);transition:all .25s}
html[lang="ar"] .choice span{font-style:normal}
.choice input:checked + span{background:var(--gold);border-color:var(--gold);color:#fff}
.choice input:focus-visible + span{outline:1px solid var(--gold);outline-offset:3px}
.hint{font-style:italic;color:var(--ink-soft)}
html[lang="ar"] .hint{font-style:normal}
.hint a{color:var(--gold-lo)}

.closing{display:flex;flex-direction:column;align-items:center;gap:2px}
.closing .s{font-family:var(--f-script);font-size:2.4rem;line-height:1.1}
html[lang="ar"] .closing .s{font-family:var(--f-ar-script);font-size:1.9rem;line-height:1.6}
.closing small{font-family:var(--f-caps);letter-spacing:.34em;font-size:.72rem;color:var(--ink-soft)}
html[lang="ar"] .closing small{font-family:var(--f-ar);letter-spacing:0;font-size:1rem}


/* moving scene + new sections */
.stage{position:relative;width:min(100%,360px);max-width:100%;aspect-ratio:4/5;border-radius:50% 50% 14px 14px / 34% 34% 14px 14px;overflow:hidden;
  background:radial-gradient(80% 60% at 50% 35%, #FFFFFF 0%, #FBF6EC 55%, #F1E6CF 100%);box-shadow:0 30px 50px -30px rgba(140,106,43,.45), inset 0 0 0 1px rgba(184,145,63,.6), inset 0 -60px 80px -40px rgba(214,184,120,.35)}
.stage::before{content:"";position:absolute;inset:8px;border:1px solid rgba(184,145,63,.45);border-radius:inherit;pointer-events:none;z-index:2}
.stage::after{content:"";position:absolute;left:50%;top:42%;width:62%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle, rgba(235,205,140,.25), transparent 65%);pointer-events:none}
.stage canvas{position:relative;z-index:1;display:block;width:100%;height:100%;cursor:pointer;touch-action:manipulation}
.stage .mono{position:absolute;inset:auto 0 9%;z-index:1;text-align:center;font-family:var(--f-script);font-size:2.6rem;color:var(--gold);pointer-events:none;transition:opacity .6s}
.stage.live .mono{opacity:0}
.tap{font-style:italic;font-size:.95rem;color:var(--ink-soft);margin-top:-26px;display:flex;align-items:center;gap:8px}
html[lang="ar"] .tap{font-style:normal;font-size:1.05rem}
.tap::before,.tap::after{content:"";width:22px;height:1px;background:rgba(176,141,74,.6)}
.song{font-family:var(--f-caps);letter-spacing:.22em;font-size:.76rem;color:var(--ink);background:transparent;border:1px solid rgba(176,141,74,.6);border-radius:999px;padding:9px 18px 9px 14px;display:inline-flex;align-items:center;gap:10px;cursor:pointer;margin-top:-18px;transition:background .3s,color .3s}
html[lang="ar"] .song{font-family:var(--f-ar);letter-spacing:0;font-size:1rem;padding:6px 14px 6px 18px}
.song:hover{background:var(--gold);color:#fff}
.song:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.bars i{width:2px;height:4px;background:var(--gold);border-radius:1px}
.song.on .bars i{animation:eq 1s ease-in-out infinite}
.song.on .bars i:nth-child(2){animation-delay:.2s}.song.on .bars i:nth-child(3){animation-delay:.45s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}

.verse{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:32ch}
.verse p{margin:0;font-family:var(--f-display);font-style:italic;font-size:1.12rem;line-height:1.7;color:var(--ink)}
html[lang="ar"] .verse p{font-family:var(--f-ar);font-style:normal;font-size:1.45rem;line-height:2}
.verse cite{font-family:var(--f-caps);font-style:normal;letter-spacing:.26em;font-size:.72rem;color:var(--gold)}
html[lang="ar"] .verse cite{font-family:var(--f-ar);letter-spacing:0;font-size:1rem}

.letter{width:100%;padding:30px 22px;background:var(--ivory);border:1px solid rgba(176,141,74,.35);display:flex;flex-direction:column;gap:14px;position:relative}
.letter::before{content:"";position:absolute;top:-1px;left:50%;width:44px;height:2px;background:var(--gold);transform:translateX(-50%)}
.letter .dear{font-family:var(--f-script);font-size:2rem;line-height:1.1;color:var(--gold-lo)}
html[lang="ar"] .letter .dear{font-family:var(--f-ar-script);font-size:1.6rem;line-height:1.6}
.letter p{margin:0;font-style:italic;font-size:1.08rem;text-align:center}
html[lang="ar"] .letter p{font-style:normal;font-size:1.2rem}
.letter .sig{font-family:var(--f-script);font-size:1.8rem;color:var(--ink)}
html[lang="ar"] .letter .sig{font-family:var(--f-ar-script);font-size:1.5rem}

.countwrap{display:flex;flex-direction:column;align-items:center;gap:12px}

@media (prefers-reduced-motion:no-preference){
  .lang-swap{animation:fade .6s ease both}
  @keyframes fade{from{opacity:.001}to{opacity:1}}
}

/* opening envelope */
.gate{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
  background:radial-gradient(80% 60% at 50% 40%, #FFFFFF 0%, #FBF5E8 60%, #F0E2C4 100%);
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  transition:opacity 1s ease .15s, visibility 0s linear 1.2s;cursor:pointer;text-align:center}
.gate.inside{opacity:0;visibility:hidden;pointer-events:none}
.gate .glang{position:absolute;top:max(14px,env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:center;gap:26px;direction:ltr}
.gate .glang button{background:none;border:0;cursor:pointer;color:rgba(140,106,43,.55);font-family:var(--f-caps);letter-spacing:.3em;font-size:.82rem;padding:6px 2px}
.gate .glang button[data-l="ar"]{font-family:var(--f-ar);letter-spacing:0;font-size:1.05rem}
.gate .glang button[aria-pressed="true"]{color:#8C6A2B;border-bottom:1px solid #B8913F}
.gate .glang button:focus-visible{outline:1px solid #B8913F;outline-offset:4px}
.g-top{font-family:var(--f-caps);letter-spacing:.38em;font-size:.78rem;color:var(--gold-lo)}
html[lang="ar"] .g-top{font-family:var(--f-ar);letter-spacing:0;font-size:1.15rem}
.env{position:relative;width:min(84vw,330px);aspect-ratio:3/2;perspective:900px}
.env .back{position:absolute;inset:0;background:linear-gradient(160deg,#FFFFFF,#F6EEDC);border-radius:4px;box-shadow:0 30px 60px -24px rgba(140,106,43,.55), 0 0 0 1px rgba(184,145,63,.5)}
.env .ecard{position:absolute;padding:0;width:auto;left:7%;right:7%;top:8%;bottom:6%;background:var(--card);border:1px solid rgba(176,141,74,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform 1.1s cubic-bezier(.3,.7,.2,1) .45s;z-index:1}
.env .ecard .ln{font-family:var(--f-script);font-size:2.1rem;line-height:1.1}
html[lang="ar"] .env .ecard .ln{font-family:var(--f-ar-script);font-size:1.8rem;line-height:1.5}
.env .ecard small{font-family:var(--f-caps);letter-spacing:.3em;font-size:.62rem;color:var(--ink-soft)}
html[lang="ar"] .env .ecard small{font-family:var(--f-ar);letter-spacing:0;font-size:.9rem}
.env .front{position:absolute;inset:0;z-index:2;border-radius:4px;background:
  linear-gradient(to top right, #FFFFFF 49.6%, #F6EEDC 50%) left top/50.5% 100% no-repeat,
  linear-gradient(to top left, #FDFAF3 49.6%, #F6EEDC 50%) right top/50.5% 100% no-repeat;box-shadow:inset 0 0 0 1px rgba(184,145,63,.45)}
.env .front::after{content:"";position:absolute;left:0;right:0;bottom:0;height:58%;background:linear-gradient(#FFFFFF,#FAF4E7);clip-path:polygon(0 100%,50% 18%,100% 100%);box-shadow:inset 0 1px 0 #D8BC7C}
.env .flap{position:absolute;left:0;right:0;top:0;height:62%;z-index:3;transform-origin:top center;transition:transform .8s cubic-bezier(.5,0,.3,1),z-index 0s linear .4s}
.env .flap::before{content:"";position:absolute;inset:0;background:linear-gradient(#FFFFFF,#F3E8D2);clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 3px 3px rgba(140,106,43,.25))}
.env .flap .wax{position:absolute;left:50%;bottom:-24px;width:64px;height:64px;transform:translateX(-50%);transition:opacity .3s}
.gate.opened .flap{transform:rotateX(180deg);z-index:0}
.gate.opened .flap .wax{opacity:0}
.gate.opened .ecard{transform:translateY(-62%)}
.g-tap{font-family:var(--f-display);font-style:italic;color:var(--gold-lo);font-size:1.15rem;display:flex;align-items:center;gap:10px}
html[lang="ar"] .g-tap{font-family:var(--f-ar);font-style:normal;font-size:1.3rem}
.g-tap::before,.g-tap::after{content:"";width:26px;height:1px;background:rgba(184,145,63,.6)}
@media (prefers-reduced-motion:no-preference){ .g-tap{animation:breathe 2.4s ease-in-out infinite} @keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}} }
</style>

<canvas id="petals" aria-hidden="true"></canvas>
<div class="gate" id="gate" role="button" tabindex="0" aria-label="Open the invitation">
  <div class="glang"><button type="button" data-l="en" aria-pressed="true">ENGLISH</button><button type="button" data-l="ar" aria-pressed="false">العربية</button></div>
  <div class="g-top" data-i="gTop"></div>
  <div class="env" aria-hidden="true">
    <div class="back"></div>
    <div class="ecard"><div class="ln foil" data-i="gNames"></div><small data-i="gDate"></small></div>
    <div class="front"></div>
    <div class="flap"><svg class="wax" viewBox="0 0 64 64"><defs><radialGradient id="wax2" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#F1D894"/><stop offset=".55" stop-color="#C49A45"/><stop offset="1" stop-color="#8C6A2B"/></radialGradient></defs><path d="M32 3c5 0 7 3 11 4s8 1 10 5 0 7 2 11 4 6 3 10-4 6-5 10-1 8-5 10-7 1-11 3-6 4-10 3-6-4-10-5-8 0-10-4 0-7-2-11-4-6-3-10 4-6 5-10 1-8 5-10 7-1 11-3 5-3 9-3z" fill="url(#wax2)"/><circle cx="32" cy="32" r="19" fill="none" stroke="#FFF6DD" stroke-width=".8"/><text class="gseal" x="32" y="38" text-anchor="middle" font-family="Pinyon Script, cursive" font-size="18" fill="#FFFBEF">A&amp;F</text></svg></div>
  </div>

/* ================= the toast =================
   Two crystal flutes of golden champagne lean in and clink on a white satin table;
   bubbles rise, gold leaf drifts down, and each clink throws a burst of gold light.
   A pair of gold rings rests between them. Touch the glasses to make them clink. */
const stage=document.getElementById("stage"), sc=document.getElementById("scene");
let R3=null;
function initRings(){
  if(!window.THREE) return;
  let renderer;
  try{ renderer=new THREE.WebGLRenderer({canvas:sc,antialias:true,alpha:true}); }catch(e){ return; }
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=.92;
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(28,1,.1,100);

  // bright studio with gold reflectors and a few darker strips so crystal edges read on white
  const env=new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.SphereGeometry(20,32,16),new THREE.MeshBasicMaterial({color:0xece6db,side:THREE.BackSide})));
  const panel=(w,h,pos,col,k)=>{ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(col).multiplyScalar(k),side:THREE.DoubleSide})); m.position.set(...pos); m.lookAt(0,0,0); env.add(m); };
  panel(12,4,[0,10,3],0xffffff,3); panel(3,12,[-9,2,4],0xffffff,2.4); panel(3,12,[9,2,2],0xfff4e0,2.2);
  panel(3,14,[-6,0,-8],0x3a2c18,1); panel(3,14,[6,0,-8],0x3a2c18,1); panel(1.5,12,[-7,1,7],0x3a2c18,1); panel(1.5,12,[7,1,7],0x3a2c18,1); panel(14,1.5,[0,-2,-9],0x6b5530,1);
  panel(5,5,[0,3,12],0xffe7b0,1.6); panel(10,3,[0,-9,5],0xd9b46a,1.2);
  const pmrem=new THREE.PMREMGenerator(renderer); scene.environment=pmrem.fromScene(env,.02).texture;

  const gold=new THREE.MeshStandardMaterial({color:0xd9a441,metalness:1,roughness:.2});
  const glassMat=new THREE.MeshPhysicalMaterial({color:0xffffff,metalness:0,roughness:0,transparent:true,opacity:.07,envMapIntensity:2.4,clearcoat:1,clearcoatRoughness:0,side:THREE.DoubleSide,depthWrite:false});
  const rimMat=new THREE.MeshStandardMaterial({color:0xe7c784,metalness:1,roughness:.2});
  const wineMat=new THREE.MeshPhysicalMaterial({color:0xc98512,metalness:0,roughness:.05,transparent:true,opacity:1,emissive:0xb06a00,emissiveIntensity:.75,envMapIntensity:1.6,clearcoat:1});
  const rimShader=new THREE.ShaderMaterial({uniforms:{c:{value:new THREE.Color(0x8a6a2e)},o:{value:.6}},transparent:true,depthWrite:false,side:THREE.DoubleSide,
    vertexShader:'varying vec3 vN; varying vec3 vV; void main(){ vec4 mv=modelViewMatrix*vec4(position,1.0); vN=normalize(normalMatrix*normal); vV=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }',
    fragmentShader:'uniform vec3 c; uniform float o; varying vec3 vN; varying vec3 vV; void main(){ float f=pow(1.0-abs(dot(normalize(vN),normalize(vV))),2.4); gl_FragColor=vec4(c, f*o); }'});

  // flute profile (outer wall up, inner wall down) for a thin crystal glass
  const outer=[[.46,0],[.46,.03],[.12,.06],[.045,.12],[.035,1.25],[.06,1.36],[.14,1.5],[.21,1.78],[.255,2.15],[.272,2.6],[.275,2.95]];
  const prof=outer.map(([r,y])=>new THREE.Vector2(r,y));
  const inner=[[.262,2.95],[.259,2.6],[.242,2.15],[.196,1.8],[.12,1.55],[.02,1.42],[0,1.41]];
  inner.forEach(([r,y])=>prof.push(new THREE.Vector2(r,y)));
  prof.unshift(new THREE.Vector2(0,0));
  const fluteGeo=new THREE.LatheGeometry(prof,64);
  const liquidTop=2.42;
  const liq=[[0,1.43],[.11,1.56],[.19,1.82],[.236,2.15],[.25,liquidTop],[0,liquidTop]].map(([r,y])=>new THREE.Vector2(r,y));
  const liqGeo=new THREE.LatheGeometry(liq,48);

  function makeFlute(side){
    const pivot=new THREE.Group(); pivot.position.x=side*.72;
    const glass=new THREE.Mesh(fluteGeo,glassMat); glass.renderOrder=3;
    const wine=new THREE.Mesh(liqGeo,wineMat); wine.renderOrder=2;
    const rim=new THREE.Mesh(new THREE.TorusGeometry(.2685,.006,8,96),rimMat); rim.rotation.x=Math.PI/2; rim.position.y=2.95;
    const edge=new THREE.Mesh(fluteGeo,rimShader); edge.renderOrder=4;
    pivot.add(wine,glass,edge,rim);
    // bubbles
    const N=46, pos=new Float32Array(N*3), sp=[];
    for(let i=0;i<N;i++){ const y=1.48+Math.random()*(liquidTop-1.5); const r=Math.random()*.1; const a=Math.random()*6.28; pos[i*3]=Math.cos(a)*r; pos[i*3+1]=y; pos[i*3+2]=Math.sin(a)*r; sp.push(.004+Math.random()*.006); }
    const bg=new THREE.BufferGeometry(); bg.setAttribute("position",new THREE.BufferAttribute(pos,3));
    const bubbles=new THREE.Points(bg,new THREE.PointsMaterial({color:0xfff8e6,size:.028,transparent:true,opacity:.9,depthWrite:false}));
    bubbles.renderOrder=4; pivot.add(bubbles);
    scene.add(pivot);
    return {pivot,bg,sp,N,side};
  }
  const flutes=[makeFlute(-1),makeFlute(1)];

  // the rings resting between the glasses
  const ringA=new THREE.Mesh(new THREE.TorusGeometry(.17,.028,32,120),gold); ringA.position.set(-.12,.05,.95); ringA.rotation.x=-Math.PI/2+.12; ringA.scale.setScalar(1.5);
  const ringB=new THREE.Mesh(new THREE.TorusGeometry(.15,.022,32,120),new THREE.MeshStandardMaterial({color:0xe9bd62,metalness:1,roughness:.18})); ringB.position.set(.16,.14,1.0); ringB.rotation.set(-.9,.3,.4); ringB.scale.setScalar(1.5);
  const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.045,0),new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:0,metalness:.2,envMapIntensity:4,clearcoat:1,flatShading:true}));
  gem.position.set(-.12,.09,.7); gem.scale.set(1.5,1.2,1.5); scene.add(ringA,ringB,gem);

  // satin table: a soft contact-shadow disc
  const sh=document.createElement("canvas"); sh.width=sh.height=128; const shc=sh.getContext("2d");
  const sg=shc.createRadialGradient(64,64,0,64,64,64); sg.addColorStop(0,"rgba(120,95,50,.32)"); sg.addColorStop(1,"rgba(120,95,50,0)"); shc.fillStyle=sg; shc.fillRect(0,0,128,128);
  const shTex=new THREE.CanvasTexture(sh);
  [-.72,.72].forEach(x=>{ const m=new THREE.Mesh(new THREE.PlaneGeometry(1.3,1.3),new THREE.MeshBasicMaterial({map:shTex,transparent:true,depthWrite:false})); m.rotation.x=-Math.PI/2; m.position.set(x,.002,0); scene.add(m); });
  const m2=new THREE.Mesh(new THREE.PlaneGeometry(.9,.6),new THREE.MeshBasicMaterial({map:shTex,transparent:true,depthWrite:false})); m2.rotation.x=-Math.PI/2; m2.position.set(.02,.002,.98); m2.scale.setScalar(1.4); scene.add(m2);

  // gold leaf drifting down
  const leafGeo=new THREE.PlaneGeometry(.07,.05);
  const leafMat=new THREE.MeshStandardMaterial({color:0xf1cf86,metalness:1,roughness:.25,side:THREE.DoubleSide});
  const leaves=[]; for(let i=0;i<34;i++){ const m=new THREE.Mesh(leafGeo,leafMat); m.position.set((Math.random()-.5)*4,Math.random()*4,(Math.random()-.5)*2-.4); m.rotation.set(Math.random()*6,Math.random()*6,Math.random()*6); m.userData={v:.003+Math.random()*.004,s:Math.random()*6.3,r:[Math.random()*.04,Math.random()*.04,Math.random()*.03]}; m.scale.setScalar(.6+Math.random()*.9); scene.add(m); leaves.push(m); }

  // sparkle burst at the clink
  const dot=document.createElement("canvas"); dot.width=dot.height=64; const dc=dot.getContext("2d");
  const rg=dc.createRadialGradient(32,32,0,32,32,32); rg.addColorStop(0,"rgba(255,250,235,1)"); rg.addColorStop(.3,"rgba(255,215,130,.7)"); rg.addColorStop(1,"rgba(255,215,130,0)"); dc.fillStyle=rg; dc.fillRect(0,0,64,64);
  const SN=60, spos=new Float32Array(SN*3), svel=[]; for(let i=0;i<SN;i++) svel.push(new THREE.Vector3());
  const sgeo=new THREE.BufferGeometry(); sgeo.setAttribute("position",new THREE.BufferAttribute(spos,3));
  const smat=new THREE.PointsMaterial({size:.12,map:new THREE.CanvasTexture(dot),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:0});
  const spark=new THREE.Points(sgeo,smat); spark.renderOrder=5; scene.add(spark);
  let sparkLife=99;
  function burst(){ const c=new THREE.Vector3(0,2.88,0); for(let i=0;i<SN;i++){ spos[i*3]=c.x; spos[i*3+1]=c.y; spos[i*3+2]=c.z; const a=Math.random()*6.28, b=Math.random()*3.14; svel[i].set(Math.cos(a)*Math.sin(b),Math.cos(b)*.8+.2,Math.sin(a)*Math.sin(b)).multiplyScalar(.012+Math.random()*.025); } sparkLife=0; }

  scene.add(new THREE.AmbientLight(0xffffff,.25));
  const key=new THREE.DirectionalLight(0xfff3dc,1.1); key.position.set(3,6,5); scene.add(key);

  // clink choreography
  const apart=.035, touch=.152;
  let clinkT=-10, nextClink=1.2;
  function tilt(s){ const d=s-clinkT; if(d<0||d>1.6) return apart+Math.sin(s*.9)*.006; if(d<.55){ const k=d/.55; return apart+(touch-apart)*(1-Math.pow(1-k,3)); } const k=(d-.55)/1.05; return touch-(touch-apart)*(1-Math.pow(1-k,2)); }
  let burstDone=true;
  function size(){ const r=stage.getBoundingClientRect(); renderer.setSize(r.width,r.height,false); camera.aspect=r.width/r.height; const z=camera.aspect<.85?8.3:7.4; camera.position.set(0,1.9,z); camera.lookAt(0,1.45,0); camera.updateProjectionMatrix(); }
  function frame(t){
    const s=t*.001;
    if(s>nextClink){ clinkT=s; nextClink=s+5; burstDone=false; }
    const th=tilt(s);
    if(!burstDone && s-clinkT>.55){ burst(); burstDone=true; }
    flutes.forEach(f=>{ f.pivot.rotation.z=f.side*th; f.pivot.position.y=.46*Math.sin(th); f.pivot.rotation.y=f.side*.08;
      const p=f.bg.attributes.position.array; for(let i=0;i<f.N;i++){ p[i*3+1]+=f.sp[i]; p[i*3]+=Math.sin(s*3+i)*.0006; if(p[i*3+1]>liquidTop-.02){ p[i*3+1]=1.48+Math.random()*.15; const a=Math.random()*6.28, r=Math.random()*.08; p[i*3]=Math.cos(a)*r; p[i*3+2]=Math.sin(a)*r; } } f.bg.attributes.position.needsUpdate=true; });
    for(const m of leaves){ const u=m.userData; m.position.y-=u.v; m.position.x+=Math.sin(s+u.s)*.003; m.rotation.x+=u.r[0]; m.rotation.y+=u.r[1]; m.rotation.z+=u.r[2]; if(m.position.y<-.2){ m.position.y=4; m.position.x=(Math.random()-.5)*4; } }
    if(sparkLife<70){ sparkLife++; for(let i=0;i<SN;i++){ spos[i*3]+=svel[i].x; spos[i*3+1]+=svel[i].y; spos[i*3+2]+=svel[i].z; svel[i].y-=.0006; svel[i].multiplyScalar(.97); } sgeo.attributes.position.needsUpdate=true; smat.opacity=Math.max(0,1-sparkLife/70); } else smat.opacity=0;
    gem.material.envMapIntensity=4+Math.sin(s*6)*1.2;
    camera.position.x=Math.sin(s*.25)*.3; camera.lookAt(0,1.45,0);
    renderer.render(scene,camera);
  }
  sc.addEventListener("pointerdown",()=>{ const s=performance.now()*.001; if(s-clinkT>1.6){ clinkT=s; nextClink=s+6.5; burstDone=false; } if(reduce){ let k=0; const run=()=>{ frame(performance.now()); if(++k<100) requestAnimationFrame(run); }; run(); } });
  size(); addEventListener("resize",()=>{ size(); if(reduce) frame(0); });
  stage.classList.add("live");
  R3={frame};
  frame(0);
}

/* ================= lounge music (original, generated live) =================
   Soft bossa-nova lounge: electric-piano comping on a jazz progression,
   upright-style bass, brushed shaker, rim click and a gentle vibraphone line. */
let AC=null, bus=null, playing=false, nextT=0, step=0, timer=null;
const mf=m=>440*Math.pow(2,(m-69)/12);
const BPM=112, E8=60/BPM/2;
const PROG=[
  {b:48,v:[64,67,71,74]}, {b:45,v:[60,64,67,71]}, {b:50,v:[65,69,72,76]}, {b:43,v:[65,69,71,76]},
  {b:52,v:[62,67,71,74]}, {b:45,v:[61,64,67,70]}, {b:50,v:[65,69,72,77]}, {b:43,v:[65,67,71,74]}
];
const COMP=[0,3,6], BASS=[[0,0],[3,7],[4,7],[7,0]], CLAVE=[0,3,6,10,12];
function ep(m,t,dur,vol){            // Rhodes-like FM electric piano
  const c=AC.createOscillator(), mod=AC.createOscillator(), mg=AC.createGain(), g=AC.createGain();
  c.type="sine"; c.frequency.value=mf(m); mod.type="sine"; mod.frequency.value=mf(m)*1; mg.gain.setValueAtTime(mf(m)*1.1,t); mg.gain.exponentialRampToValueAtTime(mf(m)*.08,t+.35);
  mod.connect(mg); mg.connect(c.frequency); c.connect(g); g.connect(bus);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.006); g.gain.exponentialRampToValueAtTime(vol*.35,t+.25); g.gain.exponentialRampToValueAtTime(.0005,t+dur);
  c.start(t); mod.start(t); c.stop(t+dur+.05); mod.stop(t+dur+.05);
}
function vib(m,t,vol){               // vibraphone with tremolo
  const o=AC.createOscillator(), g=AC.createGain(), trem=AC.createOscillator(), tg=AC.createGain();
  o.type="sine"; o.frequency.value=mf(m); trem.frequency.value=5.5; tg.gain.value=vol*.35;
  trem.connect(tg); tg.connect(g.gain); o.connect(g); g.connect(bus);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0005,t+2.2);
  o.start(t); trem.start(t); o.stop(t+2.3); trem.stop(t+2.3);
}
function bass(m,t,dur){
  const o=AC.createOscillator(), f=AC.createBiquadFilter(), g=AC.createGain();
  o.type="triangle"; o.frequency.value=mf(m-12); f.type="lowpass"; f.frequency.value=420;
  o.connect(f); f.connect(g); g.connect(bus);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.34,t+.012); g.gain.exponentialRampToValueAtTime(.12,t+.2); g.gain.exponentialRampToValueAtTime(.0005,t+dur);
  o.start(t); o.stop(t+dur+.05);
}
let noiseBuf=null;
function shaker(t,vol){
  const s=AC.createBufferSource(); s.buffer=noiseBuf; const f=AC.createBiquadFilter(); f.type="highpass"; f.frequency.value=6500; const g=AC.createGain();
  s.connect(f); f.connect(g); g.connect(bus); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0005,t+.07); s.start(t); s.stop(t+.08);
}
function rim(t){
  const o=AC.createOscillator(), g=AC.createGain(), f=AC.createBiquadFilter(); o.type="square"; o.frequency.value=1750; f.type="bandpass"; f.frequency.value=1800; f.Q.value=6;
  o.connect(f); f.connect(g); g.connect(bus); g.gain.setValueAtTime(.09,t); g.gain.exponentialRampToValueAtTime(.0005,t+.04); o.start(t); o.stop(t+.05);
}
let lastVib=0;
function schedule(){
  while(nextT<AC.currentTime+1){
    const bar=Math.floor(step/8)%PROG.length, e=step%8, ch=PROG[bar], t=nextT, sw=(e%2)?E8*.08:0;
    if(COMP.includes(e)) ch.v.forEach((m,i)=>ep(m,t+sw+i*.008,E8*(e===6?3.2:2.6),.055));
    BASS.forEach(([pos,iv])=>{ if(pos===e) bass(ch.b+iv,t,E8*(pos===0||pos===4?2.8:1.2)); });
    shaker(t+sw, e%2?.05:.025);
    const ce=(Math.floor(step/8)%2)*8+e; if(CLAVE.includes(ce%16)) rim(t);
    if(step-lastVib>3 && Math.random()<.32){ const pool=ch.v.map(m=>m+12); vib(pool[Math.floor(Math.random()*pool.length)],t+sw,.06); lastVib=step; }
    nextT+=E8; step++;
  }
}
function setupBus(){
    bus=AC.createGain(); bus.gain.value=.8;
    const comp=AC.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=3;
    const rev=AC.createConvolver(), len=AC.sampleRate*2.6, ir=AC.createBuffer(2,len,AC.sampleRate);
    for(let ch=0;ch<2;ch++){ const d=ir.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2); }
    rev.buffer=ir; const wet=AC.createGain(); wet.gain.value=.32;
    bus.connect(comp); bus.connect(rev); rev.connect(wet); wet.connect(comp); comp.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*.2,AC.sampleRate); const nd=noiseBuf.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
}
function toggleSong(){
  const btn=document.getElementById("song");
  if(!AC){
    try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
    setupBus();
  }
  playing=!playing;
  if(playing){ AC.resume(); bus.gain.cancelScheduledValues(AC.currentTime); bus.gain.setValueAtTime(.001,AC.currentTime); bus.gain.exponentialRampToValueAtTime(.8,AC.currentTime+1.5); nextT=AC.currentTime+.1; timer=setInterval(schedule,150); schedule(); }
  else { clearInterval(timer); bus.gain.setTargetAtTime(.0001,AC.currentTime,.4); }
  btn.classList.toggle("on",playing); btn.setAttribute("aria-pressed",playing);
  document.getElementById("song-lbl").textContent = playing ? T[lang].songPause : T[lang].songPlay;
}
let songBtnMode="lounge";
let songBuf=null, songSrc=null, songOffset=0, songStartAt=0, songGain=null, onSongEnd=null, songReady=Promise.resolve(false);
function b64ToBuf(uri){ const b=atob(uri.slice(uri.indexOf(",")+1)); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u.buffer; }
// sound 2 plays through a plain audio element started inside the guest's tap:
// the most dependable way on iPhone and Android (and it is not muted by the iPhone silent switch)
const songEl=document.getElementById("song2");
function prepareSong(){
  try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
  try{ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); setupBus(); } }catch(e){}
  songBuf=true; songReady=Promise.resolve(true);
  songEl.addEventListener("ended",()=>{ songSrc=null; songOffset=0; setSongBtn(false); const f=onSongEnd; onSongEnd=null; f&&f(); });
}
function playSong(){
  songEl.volume=1; const p=songEl.play(); songSrc=true; setSongBtn(true);
  if(p && p.catch) p.catch(()=>{ songSrc=null; setSongBtn(false); const f=onSongEnd; onSongEnd=null; f&&f(); });
}
function pauseSong(){ songEl.pause(); songSrc=null; setSongBtn(false); }
function setSongBtn(on){ const btn=document.getElementById("song"); btn.classList.toggle("on",on); btn.setAttribute("aria-pressed",on); document.getElementById("song-lbl").textContent = on ? T[lang].songPause : T[lang].songPlay; }
document.getElementById("song").addEventListener("click",()=>{
  if(songBtnMode==="song"){ if(songSrc) pauseSong(); else { const end=onSongEnd; playSong(); onSongEnd=end; } return; }
  toggleSong();
});


function heart(c,x,y,s){ c.beginPath(); c.moveTo(x,y+s*.9); c.bezierCurveTo(x-s*1.4,y,x-s*.7,y-s*1.1,x,y-s*.35); c.bezierCurveTo(x+s*.7,y-s*1.1,x+s*1.4,y,x,y+s*.9); c.fill(); }
/* ================= gold-ink map ================= */
const mc=document.getElementById("map"), mx=mc.getContext("2d"); let MW,MH;
function sizeMap(){ const d=Math.min(devicePixelRatio||1,2), r=mc.getBoundingClientRect(); MW=r.width; MH=r.height; mc.width=MW*d; mc.height=MH*d; mx.setTransform(d,0,0,d,0,0); }
function drawMap(t=0){
  if(!MW) return; const c=mx, w=MW, h=MH, L=T[lang];
  c.clearRect(0,0,w,h); c.fillStyle="#FFFDF9"; c.fillRect(0,0,w,h);
  c.fillStyle="rgba(235,215,163,.22)"; c.beginPath(); c.moveTo(w*.82,0); c.bezierCurveTo(w*.74,h*.35,w*.95,h*.55,w*.86,h); c.lineTo(w,h); c.lineTo(w,0); c.fill();
  c.strokeStyle="rgba(184,145,63,.4)"; c.lineWidth=.6; for(let i=1;i<4;i++){ c.beginPath(); c.moveTo(w*(.82+i*.04),0); c.bezierCurveTo(w*(.74+i*.04),h*.35,w*(.95+i*.02),h*.55,w*(.86+i*.03),h); c.stroke(); }
  c.fillStyle="rgba(235,215,163,.18)"; c.beginPath(); c.ellipse(w*.16,h*.2,w*.12,h*.1,0,0,6.28); c.fill(); c.beginPath(); c.ellipse(w*.2,h*.82,w*.1,h*.09,0,0,6.28); c.fill();
  const road=(pts,wd,a)=>{ c.strokeStyle=`rgba(176,141,74,${a})`; c.lineWidth=wd; c.lineCap="round"; c.beginPath(); pts.forEach(([x,y],i)=> i?c.lineTo(w*x,h*y):c.moveTo(w*x,h*y)); c.stroke(); };
  road([[0,.48],[.3,.52],[.58,.44],[.8,.46]],2.2,.9);
  road([[.44,0],[.46,.5],[.4,1]],1.6,.8); road([[.12,0],[.2,.45],[.16,1]],.8,.55); road([[.46,.76],[.78,.8]],.8,.55); road([[0,.25],[.46,.27]],.8,.55); road([[.58,.44],[.62,1]],.8,.55); road([[.62,.2],[.58,.44]],.8,.55);
  c.strokeStyle="rgba(176,141,74,.35)"; c.lineWidth=.6; for(let i=0;i<16;i++){ const x=((i*37)%72)/100+.03, y=((i*53)%86)/100+.04; if(Math.abs(x-.45)<.07||Math.abs(y-.48)<.07||x>.7) continue; c.strokeRect(w*x,h*y,w*.05,h*.045); }
  const px=w*.53, py=h*.42, p=reduce?0:(t*.0007)%1;
  c.strokeStyle=`rgba(176,141,74,${.6*(1-p)})`; c.lineWidth=1; c.beginPath(); c.arc(px,py,8+p*30,0,6.28); c.stroke();
  c.fillStyle="#B8913F"; c.beginPath(); c.moveTo(px,py); c.bezierCurveTo(px-13,py-16,px-12,py-32,px,py-32); c.bezierCurveTo(px+12,py-32,px+13,py-16,px,py); c.fill();
  c.fillStyle="#FFFFFF"; heart(c,px,py-21,4.2);
  c.font = lang==="ar" ? "italic 22px Amiri, serif" : "italic 21px 'Bodoni Moda', Georgia, serif";
  c.fillStyle="#4A3A22"; c.textAlign="center"; c.textBaseline="alphabetic"; c.fillText(L.mapLabel, px, py-44);
  c.strokeStyle="rgba(176,141,74,.8)"; c.lineWidth=.7; const tw=c.measureText(L.mapLabel).width; c.beginPath(); c.moveTo(px-tw/2,py-38); c.lineTo(px+tw/2,py-38); c.stroke();
  const ox=w-26, oy=30; c.strokeStyle="#B08D4A"; c.lineWidth=.8; c.beginPath(); c.arc(ox,oy,12,0,6.28); c.stroke();
  c.fillStyle="#B08D4A"; c.beginPath(); c.moveTo(ox,oy-10); c.lineTo(ox+3,oy); c.lineTo(ox,oy+10); c.lineTo(ox-3,oy); c.fill();
  c.font = lang==="ar" ? "13px Amiri, serif" : "11px 'Cormorant SC', serif"; c.fillText(L.north,ox,oy-16);
}

/* ================= falling petals ================= */
const pc=document.getElementById("petals"), pc2=pc.getContext("2d"); let PW,PH,petals=[];
function sizePetals(){ const d=Math.min(devicePixelRatio||1,2); PW=innerWidth; PH=innerHeight; pc.width=PW*d; pc.height=PH*d; pc2.setTransform(d,0,0,d,0,0);
  petals=Array.from({length:Math.round(PW/55)+4},()=>({x:Math.random()*PW,y:Math.random()*PH,r:3.5+Math.random()*3,v:.25+Math.random()*.4,s:Math.random()*6.28,rot:Math.random()*6.28,c:Math.random()<.5?"rgba(255,255,255,.95)":"rgba(222,190,120,.6)"})); }
function drawPetals(){ pc2.clearRect(0,0,PW,PH); for(const p of petals){ p.y+=p.v; p.s+=.01; p.x+=Math.sin(p.s)*.45; p.rot+=.01; if(p.y>PH+10){p.y=-10;p.x=Math.random()*PW;}
  pc2.save(); pc2.translate(p.x,p.y); pc2.rotate(p.rot); pc2.scale(1,Math.abs(Math.cos(p.s*2))*.6+.4); pc2.fillStyle=p.c; pc2.beginPath(); pc2.moveTo(0,-p.r); pc2.bezierCurveTo(p.r*.9,-p.r*.4,p.r*.6,p.r*.8,0,p.r); pc2.bezierCurveTo(-p.r*.6,p.r*.8,-p.r*.9,-p.r*.4,0,-p.r); pc2.fill(); pc2.restore(); } }

/* ================= language ================= */
let lang="en";
try{ const s=localStorage.getItem("af-wed-lang"); if(s==="ar"||s==="en") lang=s; }catch(e){}
if(location.hash==="#ar") lang="ar"; if(location.hash==="#en") lang="en";
function applyLang(l){
  lang=l; const t=T[l], root=document.documentElement;
  root.lang=l; root.dir = l==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(e=>{ const v=t[e.dataset.i]; if(typeof v==="string") e.textContent=v; });
  document.getElementById("song-lbl").textContent = (songBtnMode==="song" ? !!songSrc : playing) ? t.songPause : t.songPlay;
  document.getElementById("g-name").placeholder=t.namePh;
  const sel=document.getElementById("g-count"), cur=+sel.value||2; sel.innerHTML="";
  for(let i=1;i<=5;i++){ const o=document.createElement("option"); o.value=i; o.textContent=t.guestsList(i); if(i===cur) o.selected=true; sel.appendChild(o); }
  const st=document.getElementById("seal-txt"); st.textContent=t.seal; st.setAttribute("font-family", l==="ar"?"Aref Ruqaa, serif":"Pinyon Script, cursive"); st.setAttribute("font-size", l==="ar"?"15":"18");
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-selected", b.dataset.l===l));
  document.querySelectorAll(".glang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.l===l));
  document.getElementById("gate").setAttribute("aria-label", t.gAria);
  document.querySelectorAll(".gseal").forEach(g=>{ g.textContent=t.seal; g.setAttribute("font-family", l==="ar"?"Aref Ruqaa, serif":"Pinyon Script, cursive"); g.setAttribute("font-size", l==="ar"?"15":"18"); });
  document.title = l==="ar" ? "زفاف عمرو و فرح" : "Amr & Farah Wedding";
  sc.setAttribute("aria-label", l==="ar" ? "كأسان من الكريستال يتلامسان في نخب، وبينهما خاتما الزفاف الذهبيان" : "Two crystal champagne flutes clinking in a toast, with a pair of gold wedding rings between them");
  document.getElementById("hint").hidden=true;
  document.querySelectorAll("#content > *").forEach(n=>{ n.classList.remove("lang-swap"); void n.offsetWidth; n.classList.add("lang-swap"); });
  try{ localStorage.setItem("af-wed-lang",l); }catch(e){}
  tick(); drawMap();
}
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>applyLang(b.dataset.l)));

/* ================= countdown ================= */
const countEl=document.getElementById("count");
function tick(){
  const t=T[lang], ms=EVENT.start-Date.now();
  if(ms<=0){ countEl.innerHTML=`<div class="count-done foil">${t.done}</div>`; return; }
  const v=[Math.floor(ms/864e5),Math.floor(ms/36e5)%24,Math.floor(ms/6e4)%60,Math.floor(ms/1e3)%60];
  countEl.innerHTML=v.map((n,i)=>{ let s=String(n).padStart(2,"0"); if(lang==="ar") s=toAr(s); return `<div class="unit"><b>${s}</b><span>${t.units[i]}</span></div>`; }).join('<div class="colon">·</div>');
}
setInterval(tick,1000);

/* ================= links + RSVP ================= */
const fmt=d=>d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
document.getElementById("cal").href="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("Amr & Farah Wedding")+"&dates="+fmt(EVENT.start)+"/"+fmt(EVENT.end)+"&location="+encodeURIComponent(EVENT.mapsQuery);
document.getElementById("dir").href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(EVENT.mapsQuery);
document.getElementById("rsvp").addEventListener("submit",e=>{
  e.preventDefault(); const t=T[lang], hint=document.getElementById("hint"), ne=document.getElementById("g-name"), name=ne.value.trim();
  hint.hidden=false;
  if(!name){ hint.textContent=t.needName; ne.focus(); return; }
  const c=+document.getElementById("g-count").value, yes=document.getElementById("att-yes").checked;
  const url="https://wa.me/"+EVENT.whatsapp+"?text="+encodeURIComponent(yes?t.msgYes(name,c):t.msgNo(name));
  hint.innerHTML=`${t.ready} <a href="${url}" target="_blank" rel="noopener">${t.open}</a>`;
});


/* ================= opening envelope + welcome voice ================= */
(function(){
  const gate=document.getElementById("gate"), voice=document.getElementById("henedy");
  gate.querySelectorAll(".glang button").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); applyLang(b.dataset.l); }));
  function unlockAudio(){
    if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; } setupBus(); }
    AC.resume();
  }
  let stage="closed", phase="voice";
  const tapEl=gate.querySelector(".g-tap");
  const startLounge=()=>{ if(phase==="lounge") return; phase="lounge"; songBtnMode="lounge"; if(!playing) toggleSong(); };
  const startSong=()=>{ if(phase!=="voice") return; phase="song"; songBtnMode="song";
    onSongEnd=()=>setTimeout(startLounge,600); songEl.currentTime=0; playSong(); };
  // outside: the envelope opens and the welcome voice plays
  function openEnvelope(){
    stage="outside"; gate.classList.add("opened"); unlockAudio();
    tapEl.dataset.i="gEnter"; tapEl.textContent=T[lang].gEnter;
    voice.currentTime=0; voice.volume=1;
    const p=voice.play(); if(p && p.catch) p.catch(()=>{});
  }
  // inside: the card opens to the invitation and sound 2 begins
  function enter(){
    if(stage==="inside") return; stage="inside"; unlockAudio();
    if(!voice.paused){ voice.pause(); }
    gate.classList.add("inside"); startSong();
    setTimeout(()=>{ gate.hidden=true; },1300);
  }
  function open(){ if(stage==="closed") openEnvelope(); else if(stage==="outside") enter(); }
  // try to start on its own; browsers that allow sound without a tap go straight in,
  // the rest keep the envelope waiting for one tap
  function tryAutoplay(){
    if(stage!=="closed") return;
    voice.currentTime=0;
    let p; try{ p=voice.play(); }catch(e){ return; }
    if(p && p.then) p.then(()=>{ if(stage!=="closed") return; voice.pause(); voice.currentTime=0; openEnvelope(); }).catch(()=>{});
  }
  setTimeout(tryAutoplay,600);
  gate.addEventListener("click",open);
  gate.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); } });
})();
/* ================= boot ================= */
function resize(){ sizeMap(); sizePetals(); drawMap(0); }
addEventListener("resize",resize);
initRings(); resize(); applyLang(lang); prepareSong();
function loop(t){ R3 && R3.frame(t); drawMap(t); drawPetals(); requestAnimationFrame(loop); }
if(!reduce) requestAnimationFrame(loop);
document.fonts && document.fonts.ready.then(()=>drawMap(0));
</script>
